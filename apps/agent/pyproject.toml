[project]
name = "fmi-agent"
version = "0.1.0"
description = "LiveKit Voice Agent Worker for Freshers Mock Interview (FMI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0,<0.29.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
livekit = [
    "livekit>=0.18.0",
    "livekit-agents>=0.12.0",
    "livekit-plugins-silero>=0.7.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
