[project]
name = "fmi-api"
version = "0.1.0"
description = "FastAPI Backend for Freshers Mock Interview (FMI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "starlette>=0.41.0,<0.45.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "supabase>=2.10.0",
    "pyjwt[crypto]>=2.9.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0,<0.29.0",
    "livekit-api>=0.8.0",
    "arq>=0.26.0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
