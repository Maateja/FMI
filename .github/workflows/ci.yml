name: FMI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck-web:
    name: Web Frontend (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @fmi/shared-types build

      - name: ESLint
        run: pnpm --filter web lint

      - name: Type check (Strict TypeScript)
        run: pnpm --filter web typecheck

      - name: Run unit & component tests
        run: pnpm --filter web test:run

      - name: Build web application
        run: pnpm --filter web build

  lint-and-test-api:
    name: Backend API (Ruff, Mypy & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/api
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          cd apps/api
          ruff check .

      - name: Run Mypy Type Checking
        run: |
          cd apps/api
          mypy src

      - name: Run Pytest Test Suite
        run: |
          cd apps/api
          pytest tests/ -v

  lint-and-test-agent:
    name: LiveKit Agent Worker (Ruff, Mypy & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/agent
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          cd apps/agent
          ruff check .

      - name: Run Mypy Type Checking
        run: |
          cd apps/agent
          mypy src

      - name: Run Pytest Test Suite
        run: |
          cd apps/agent
          pytest tests/ -v

  verify-rls-schema:
    name: Database RLS Security Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify RLS Policies
        run: python supabase/tests/verify_rls.py

